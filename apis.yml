x-coverage:
  state: covered
  reason: covered
  detail: >-
    Loughborough was previously profiled from a single Figshare contract. Twenty-two vendor
    surfaces, all resolving to api.figshare.com, were attributed to the institution — the same
    document fourteen other universities in this cohort also carried — split by refine-openapis
    into ten per-tag OpenAPIs and eleven apis[] entries, and everything derived from it
    (schemas, structures, examples, rulesets, vocabulary, JSON-LD context, scopes,
    authentication, agentic-access, capability edges and twenty collections) inherited that
    provenance. All of it has been removed. In its place, seven live surfaces were found by
    probing lboro.ac.uk hosts directly: the Koha ILS REST API at koha.lboro.ac.uk, which serves
    an 863KB Swagger 2.0 description naming its own host and answers GET
    /api/v1/public/libraries with Loughborough's own library records and no credential; the
    Moodle LTI 1.3 platform endpoints at learn.lboro.ac.uk, including a public JWKS; the VuFind
    Search API at vufind.lboro.ac.uk, deployed but returning "Permission denied"; the SAML 2.0
    IdP at idp.lboro.ac.uk, registered in the UK Access Management Federation aggregate under
    scope lboro.ac.uk; and the figshare, Talis Aspire and LibCal tenancies. Two of the seven are
    marked institution — Learn, which has no CNAME and sits in Loughborough's own
    158.125.161.0/24, and the IdP, whose CNAME target lut.ac.uk is Loughborough's own second
    registrable domain. The other five carry institution hostnames that CNAME to a platform
    (ptfse.net, figshare.com, talis.com, libcal.com) and are marked tenant on that basis, which
    is the same test this pipeline applies to scholarbank.nus.edu.sg. Loughborough is also a DataCite
    member in its own right (JHAH, prefixes 10.17028 and 10.26174). Two caveats on readability:
    an Anubis bot challenge fronts the HTML paths on koha.lboro.ac.uk and vufind.lboro.ac.uk,
    which is why the Koha OAI-PMH responder could not be read, and the only OAI-PMH that does
    answer is Figshare's shared endpoint scoped by set=portal_2 — a tenant surface, not an
    institution one.
