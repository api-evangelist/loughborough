aid: loughborough
name: Loughborough University
x-type: university
x-category: Public Research University
description: >-
  Loughborough University is a public research university in Leicestershire, United Kingdom, a
  member of the Midlands Innovation group, established 1909 and best known for sport science,
  engineering and design. It publishes no central developer portal, no open-data portal and no
  first-party OpenAPI, and no such thing was generated for it here. Two surfaces are unambiguously
  the university's own and are recorded as such: a self-hosted Moodle ("Learn") on Loughborough's
  own address space running as a 1EdTech LTI 1.3 Advantage platform with a publicly readable JWKS,
  and a SimpleSAMLphp SAML 2.0 Identity Provider registered in the UK Access Management Federation.
  Five more carry Loughborough's data on someone else's platform and are recorded as tenancies: a
  Koha library system whose REST API serves a live Swagger 2.0 description and nineteen keyless
  /public endpoints — the single most usable programmable surface the institution has, and hosted by
  PTFS Europe; a VuFind discovery layer whose Search API is deployed but closed; the Loughborough
  Research Repository, a figshare tenancy; Talis Aspire reading lists; and Springshare LibCal.
  Loughborough is also a DataCite member in its own right. No contract is stored under this slug,
  because none of the contracts are Loughborough's to claim.
