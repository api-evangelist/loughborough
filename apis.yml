apis:
  - aid: loughborough:research-repository-oai
    name: Loughborough Research Repository OAI-PMH
    description: >-
      OAI-PMH metadata harvesting endpoint for the Loughborough Research Repository, served via figshare
      and scoped to the Loughborough portal set. Supports Open Archives Initiative Protocol for Metadata
      Harvesting verbs (ListIdentifiers, ListRecords, Identify) for interoperability with aggregators such
      as CORE and OpenAIRE.
    humanURL: https://docs.figshare.com/
    baseURL: https://api.figshare.com/v2/oai?verb=Identify&set=portal_2
    tags:
      - Research Data
      - OAI-PMH
