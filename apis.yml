apis:
  - aid: loughborough:library-catalogue-api
    name: Loughborough University Library Catalogue API (Koha)
    x-operator: tenant
    description: >-
      The REST API of Loughborough University Library's Koha integrated library system, served
      from the university's own koha.lboro.ac.uk host. The live description at /api/v1/ is a
      Swagger 2.0 document declaring host koha.lboro.ac.uk and basePath /api/v1 across 249 paths
      and 79 tags, nineteen of them under /public. GET /api/v1/public/libraries returns
      Loughborough's own branch records — London Library at Here East, the Inter-Library Loan
      Service, library@lboro.ac.uk — with no credential at all. Staff paths require
      authentication (401). Koha is community open-source software and the contract's
      info.contact is the Koha Development Team, so no copy of the specification is stored under
      Loughborough's slug; the deployment, the host and the data are Loughborough's and that is
      what is credited here. The instance is under managed hosting by PTFS Europe
      (koha.lboro.ac.uk CNAMEs to lboro.koha.servers.ptfse.net). An Anubis bot challenge fronts
      the HTML paths on this host; the JSON API paths pass through it.
    humanURL: https://www.lboro.ac.uk/services/library/search/
    baseURL: https://koha.lboro.ac.uk/api/v1/
    tags:
      - Library
      - Library Catalog
      - Bibliographic
      - Open Access
    properties:
      - type: APIReference
        url: https://koha.lboro.ac.uk/api/v1/.html
      - type: Documentation
        url: https://koha.lboro.ac.uk/api/v1/
      - type: x-example
        url: examples/loughborough-koha-public-libraries-example.json
  - aid: loughborough:learn-lti-platform
    name: Loughborough Learn — LTI 1.3 Advantage Platform (Moodle)
    x-operator: institution
    description: >-
      Loughborough's virtual learning environment, "Learn", is a Moodle instance self-hosted at
      learn.lboro.ac.uk in the university's own 158.125.161.0/24 address space. It runs as a
      1EdTech (IMS Global) LTI 1.3 / LTI Advantage PLATFORM: the OIDC login endpoint
      (/mod/lti/auth.php), the access-token endpoint (/mod/lti/token.php) and a publicly readable
      JWKS (/mod/lti/certs.php, one RSA RS256 key) all answer live. The same deployment exposes
      Moodle Web Services at /webservice/rest/server.php, which returns a structured
      moodle_exception invalidtoken without a token — deployed, machine-readable, credentialed.
      The LTI platform issuer is https://learn.lboro.ac.uk. Moodle is community open-source
      software; no Moodle specification is stored under Loughborough's slug. The LTI platform role, the keys and the tenancy are Loughborough's.
    humanURL: https://learn.lboro.ac.uk/
    baseURL: https://learn.lboro.ac.uk/
    tags:
      - Learning Management
      - LTI
      - Education
      - Authentication
    properties:
      - type: x-jwks
        url: https://learn.lboro.ac.uk/mod/lti/certs.php
      - type: x-example
        url: examples/loughborough-moodle-lti-jwks-example.json
      - type: Documentation
        url: https://learn.lboro.ac.uk/
  - aid: loughborough:identity-federation
    name: Loughborough University SAML 2.0 Identity Provider
    x-operator: institution
    description: >-
      Loughborough operates its own SAML 2.0 Identity Provider — SimpleSAMLphp, Loughborough-branded,
      at idp.lboro.ac.uk — and is registered in the UK Access Management Federation, which feeds
      eduGAIN. The host CNAMEs to idp.lut.ac.uk (158.125.162.229); lut.ac.uk is Loughborough's OWN
      second registrable domain, retained from Loughborough University of Technology, and
      158.125.0.0/16 is Loughborough's own allocation — so this CNAME is internal, not a tenancy.
      It is declared in 0-working/university-affiliates.json so the cohort audit's --resolve rule
      stops reading the university's own IdP as a lut.ac.uk tenant. The
      federation aggregate is the machine-readable artifact: entityID
      https://idp.lboro.ac.uk/simplesaml/saml2/idp/metadata.php, mdui:DisplayName "Loughborough
      University", shibmd:Scope lboro.ac.uk, SingleSignOnService at
      https://idp.lboro.ac.uk/simplesaml/saml2/idp/SSOService.php (400 without a SAMLRequest,
      which is the live behaviour). The university also registers a Shibboleth Service Provider,
      MEGS VLE, at https://megsvle.lboro.ac.uk/shibboleth. Identity federation is
      institution-operated by definition and is the surface class most often missed for this
      cohort.
    humanURL: https://www.ukfederation.org.uk/
    baseURL: https://idp.lboro.ac.uk/simplesaml/saml2/idp/SSOService.php
    tags:
      - Identity
      - Identity Federation
      - SAML
      - Shibboleth
      - Single Sign-On
    properties:
      - type: x-saml-metadata
        url: http://metadata.ukfederation.org.uk/ukfederation-metadata.xml
      - type: x-conformance
        url: conformance/loughborough-conformance.yml
  - aid: loughborough:vufind-discovery
    name: Loughborough University Library Discovery (VuFind)
    x-operator: tenant
    description: >-
      VuFind discovery layer at vufind.lboro.ac.uk, the public search interface over the Koha
      catalogue, on managed hosting by PTFS Europe (CNAME
      lboro-vufind.infrastructure.servers.ptfse.net). VuFind's Search API is present at /api/v1
      but is not open: /api/v1/search and /api/v1/record both return HTTP 403 with
      {"status":"ERROR","statusMessage":"Permission denied"}. The VuFind OAI-PMH responder at
      /OAI/Server and the HTML surface are behind an Anubis bot challenge and returned an
      interstitial rather than content on every attempt. Recorded because the surface is real and
      deployed, not because it is usable — the honest state is deployed-but-closed.
    humanURL: https://vufind.lboro.ac.uk/
    baseURL: https://vufind.lboro.ac.uk/api/v1
    tags:
      - Library
      - Discovery
      - Search
    properties:
      - type: Documentation
        url: https://www.lboro.ac.uk/services/library/search/
  - aid: loughborough:research-repository
    name: Loughborough University Research Repository (figshare tenancy)
    x-operator: tenant
    description: >-
      The Loughborough Research Repository is the university's institutional repository for all
      research outputs, and it is a figshare tenancy: repository.lboro.ac.uk, lboro.figshare.com
      and the legacy dspace.lboro.ac.uk all CNAME to figshare.com. The data, the DOIs (DataCite
      prefixes 10.17028 and 10.26174 under member JHAH, client BL.LBORO) and the corpus are
      Loughborough's; the API contract is figshare's, published on the shared api.figshare.com/v2
      host that every figshare customer uses. Harvesting works over OAI-PMH at
      https://api.figshare.com/v2/oai with set=portal_2 — confirmed as Loughborough's by pulling
      ListRecords on that set and finding DOI prefix 10.17028 — but Identify on that endpoint
      names repositoryName "figshare" and adminEmail info@figshare.com. This is recorded as ONE
      tenant relationship. It was previously recorded as eleven separate APIs backed by ten
      per-tag copies of figshare's specification; those have been removed.
    humanURL: https://repository.lboro.ac.uk/
    baseURL: https://repository.lboro.ac.uk/
    tags:
      - Research Data
      - Repository
      - Open Access
      - OAI-PMH
      - Metadata
    properties:
      - type: Documentation
        url: https://docs.figshare.com/
      - type: x-oai-pmh
        url: https://api.figshare.com/v2/oai?verb=Identify&set=portal_2
      - type: x-vendor-repo
        url: https://github.com/api-evangelist/figshare
      - type: x-conformance
        url: conformance/loughborough-conformance.yml
  - aid: loughborough:reading-lists
    name: Loughborough University Reading Lists (Talis Aspire tenancy)
    x-operator: tenant
    description: >-
      Loughborough's reading lists run on Talis Aspire at lboro.rl.talis.com. The tenancy exposes
      linked data: https://lboro.rl.talis.com/index.json returns 200 application/json describing
      the institution in RDF terms as an aiiso:Institution named "Loughborough University". The
      list content and organisational structure are Loughborough's; the platform, the vocabulary
      and the API are Talis's.
    humanURL: https://lboro.rl.talis.com/
    baseURL: https://lboro.rl.talis.com/index.json
    tags:
      - Library
      - Reading Lists
      - Linked Data
      - Education
    properties:
      - type: Documentation
        url: https://lboro.rl.talis.com/
  - aid: loughborough:libcal
    name: Loughborough University Library Hours and Bookings (Springshare LibCal tenancy)
    x-operator: tenant
    description: >-
      Room booking, opening hours and library event data run on Springshare LibCal at
      libcal.lboro.ac.uk (CNAME region-eu.libcal.com). The legacy keyless widget endpoint
      /api_hours_grid.php?iid=0&format=json answers 200 application/json but returns an empty
      locations array for the default institution id; the LibCal 1.1 REST API at /api/1.1/*
      returns 403 without an OAuth client credential. Recorded as a tenant surface that exists
      and is credentialed, not as an open Loughborough API.
    humanURL: https://libcal.lboro.ac.uk/
    baseURL: https://libcal.lboro.ac.uk/api_hours_grid.php?iid=0&format=json
    tags:
      - Library
      - Room Booking
      - Campus Life
    properties:
      - type: Documentation
        url: https://libcal.lboro.ac.uk/
